name: Public API

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Breaking changes
    runs-on: ubuntu-24.04
    env:
      API_SYMBOL_SETS: ";UNITY_ANDROID;UNITY_IOS,COUNTLY_ENABLE_IOS_PUSH;UNITY_WEBGL;UNITY_EDITOR"
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      # The repository ignores *.csproj files because Unity generates them, so the tool's project is written here.
      - name: Build the API tool
        run: |
          mkdir -p "$RUNNER_TEMP/tool"
          cp .github/scripts/PublicApi.cs "$RUNNER_TEMP/tool/"
          cat > "$RUNNER_TEMP/tool/PublicApi.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>disable</ImplicitUsings>
              <Nullable>disable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.CodeAnalysis.CSharp" Version="4.14.0" />
            </ItemGroup>
          </Project>
          EOF
          dotnet build "$RUNNER_TEMP/tool" -c Release -o "$RUNNER_TEMP/tool/out"

      # The first parent of the pull request's merge commit is the base branch it merges into.
      - name: Compare the public API with the base branch
        run: |
          git worktree add "$RUNNER_TEMP/base" HEAD^1
          for side in base head; do
            tree="$GITHUB_WORKSPACE"
            if [ "$side" = base ]; then
              tree="$RUNNER_TEMP/base"
            fi
            dotnet "$RUNNER_TEMP/tool/out/PublicApi.dll" "$API_SYMBOL_SETS" \
              "$tree/Assets/Countly/Plugins/CountlySDK" "$tree/Assets/Countly/Plugins/Notifications" > "$RUNNER_TEMP/$side.txt"
          done
          LC_ALL=C comm -23 "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head.txt" | sed 's/^/Removed or changed: /' > "$RUNNER_TEMP/breaking.txt"

      - name: Require a CHANGELOG entry for breaking changes
        run: |
          if [ ! -s "$RUNNER_TEMP/breaking.txt" ]; then
            echo "No breaking change to the public API." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Breaking changes to the public API"
            echo '```'
            cat "$RUNNER_TEMP/breaking.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet HEAD^1 HEAD -- CHANGELOG.md; then
            echo "::error title=Breaking API change::This pull request breaks the public API without a CHANGELOG.md entry. The job summary lists each break."
            exit 1
          fi
          echo "::warning title=Breaking API change::This pull request breaks the public API. Check that CHANGELOG.md marks it as a breaking change."
